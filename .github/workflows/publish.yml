# v* 태그를 push하면 테스트 뒤 GitHub Packages에 배포한다. 태그는 사람이 단다 (common 담당 김진아).
name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test
        run: ./gradlew test

      # 버전은 build.gradle이 GITHUB_REF_TYPE·GITHUB_REF_NAME(기본 제공)에서 읽는다. v0.1.0 → 0.1.0
      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
